name: Build FaustLuna APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang debug.keystore tetap (biar signature APK konsisten tiap update)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install dependency npm
        run: npm install

      - name: Tambah platform Android (kalau belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync aset web ke project Android
        run: npx cap sync android

      - name: Generate icon aplikasi dari assets/
        run: npx capacitor-assets generate --android

      - name: Paksa signing config debug pakai debug.keystore yang sama tiap build (biar APK bisa update tanpa uninstall)
        run: python3 scripts/patch_signing.py

      - name: Build APK (debug, siap install langsung)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload hasil APK
        uses: actions/upload-artifact@v5
        with:
          name: faustluna-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
